GE_FRONTEND_PROBE 1
# Natural boot sequence through the authored intros, then the solo path:
# file select -> mode select -> mission select -> difficulty -> briefing ->
# stage start. Captures every menu 45 frames after it appears and measures
# the first 600 gameplay frames with the idle-controller timing path.
max_frames 12000
auto_capture 45
gameplay_frames 600
step menu rareware 1500
step wait 240
step capture rareware-logo-240
step menu eye-intro 1500
step wait 240
step capture eye-intro-240
step menu goldeneye-logo 3000
step wait 120
step capture goldeneye-logo-120
step press START
step menu file-select 300
step wait 60
step wallet 0
step wait 10
step capture file-select-wallet0
step press CONFIRM
step menu mode-select 300
step wait 60
step press CONFIRM
step menu mission-select 300
step wait 60
step press CONFIRM
step menu difficulty 300
step wait 60
step press CONFIRM
step menu briefing 300
step wait 60
step capture briefing-page0
step press CONFIRM
step wait 30
step capture briefing-page1
step press CONFIRM
step wait 30
step press CONFIRM
step wait 30
step press CONFIRM
step wait 30
step press CONFIRM
step wait 30
step press CONFIRM
step stage 600
step end
